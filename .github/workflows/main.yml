name: Build NovaSearch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NovaSearch
        run: |
          rm -rf project
          mkdir -p project
          tar -xzf novasearch-v2.tar.gz -C project

          echo "===== Project ====="
          find project -maxdepth 4 -type f | sort

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name "settings.gradle" \
            -printf '%h\n' | head -n 1)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Found: $ANDROID_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Fix Android configuration
        run: |
          APP_GRADLE="$ANDROID_DIR/app/build.gradle"
          PROPS="$ANDROID_DIR/gradle.properties"

          echo "===== app/build.gradle ====="
          cat "$APP_GRADLE"

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          if 'namespace "com.novasearch.browser"' not in text:
              if "android {" in text:
                  text = text.replace(
                      "android {",
                      'android {\n    namespace "com.novasearch.browser"',
                      1
                  )
              else:
                  raise SystemExit("ERROR: android block not found")

          path.write_text(text)
          PY

          touch "$PROPS"

          if grep -q "^android.useAndroidX=" "$PROPS"; then
            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROPS"
          else
            echo "android.useAndroidX=true" >> "$PROPS"
          fi

          if grep -q "^android.enableJetifier=" "$PROPS"; then
            sed -i \
              's/^android.enableJetifier=.*/android.enableJetifier=true/' \
              "$PROPS"
          else
            echo "android.enableJetifier=true" >> "$PROPS"
          fi

          echo "===== gradle.properties ====="
          cat "$PROPS"

      - name: Verify build environment
        run: |
          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          gradle --version

          echo "===== Android SDK ====="
          sdkmanager --list_installed | head -80

          echo "===== Android project ====="
          find "$ANDROID_DIR" -maxdepth 3 -type f | sort

      - name: Build Debug APK
        run: |
          cd "$ANDROID_DIR"

          echo "Building NovaSearch..."

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        run: |
          echo "===== APK OUTPUT ====="

          find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaSearch-debug-apk
          path: "${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
