name: Build NovaSearch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NovaSearch
        run: |
          mkdir -p project
          tar -xzf novasearch-v2.tar.gz -C project
          echo "Extracted files:"
          find project -maxdepth 3 -type f | sort

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find project -type f -name "settings.gradle" -printf '%h\n' | head -1)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "Android project found at: $ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Verify Android project
        run: |
          cd "$ANDROID_DIR"
          gradle --version
          find . -maxdepth 3 -type f | sort

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaSearch-debug-apk
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
