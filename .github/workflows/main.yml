name: Build NovaSearch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NovaSearch
        run: |
          rm -rf project
          mkdir project
          tar -xzf novasearch-v2.tar.gz -C project
          find project -maxdepth 4 -type f | sort

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name "settings.gradle" \
            -printf '%h\n' | head -n 1)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $ANDROID_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Fix Android namespace
        run: |
          APP_GRADLE="$ANDROID_DIR/app/build.gradle"

          echo "===== BEFORE FIX ====="
          cat "$APP_GRADLE"

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          if 'namespace "com.novasearch.browser"' not in text:
              if "android {" in text:
                  text = text.replace(
                      "android {",
                      'android {\n    namespace "com.novasearch.browser"',
                      1
                  )
              else:
                  raise SystemExit("ERROR: android { block not found")

          path.write_text(text)
          PY

          echo "===== AFTER FIX ====="
          cat "$APP_GRADLE"

      - name: Verify Android project
        run: |
          echo "===== SETTINGS ====="
          cat "$ANDROID_DIR/settings.gradle"

          echo "===== ROOT BUILD ====="
          cat "$ANDROID_DIR/build.gradle"

          echo "===== APP BUILD ====="
          cat "$ANDROID_DIR/app/build.gradle"

          echo "===== MANIFEST ====="
          cat "$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          echo "===== NAMESPACE ====="
          grep -R "namespace" "$ANDROID_DIR" || true

      - name: Build Debug APK
        run: |
          cd "$ANDROID_DIR"
          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Locate APK
        run: |
          echo "===== APK FILES ====="
          find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaSearch-debug-apk
          path: "${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
