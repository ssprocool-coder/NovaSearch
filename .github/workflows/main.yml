name: Build NovaSearch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project structure
        run: |
          echo "Repository:"
          ls -la
          echo "NovaSearch:"
          ls -la novasearch-v2
          echo "Android:"
          ls -la novasearch-v2/android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Verify Android project
        working-directory: novasearch-v2/android
        run: |
          echo "Gradle:"
          gradle --version

          echo "Android files:"
          find . -maxdepth 3 -type f | sort

      - name: Build Debug APK
        working-directory: novasearch-v2/android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          find novasearch-v2/android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaSearch-debug-apk
          path: novasearch-v2/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
